name: Continuous Deployment

on:
  push:
    branches:
      - stable
  pull_request:
    branches:
      - stable

jobs:
  cd:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v1
      - name: Docker login
        run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Build
        run: docker-compose build
      - name: Tags
        run: |
          docker tag poolup_backend_web ${{ secrets.DOCKER_USER }}/poolup_backend_web:${{ github.sha }}
          docker tag poolup_backend_web ${{ secrets.DOCKER_USER }}/poolup_backend_web:latest
      - name: Push
        run: |
          docker push ${{ secrets.DOCKER_USER }}/poolup_backend_web:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USER }}/poolup_backend_web:latest
