name: Docker Image CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set Environment Variables
        run: echo '::set-env AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}'
          echo '::set-env AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}'
          echo '::set-env JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}'
          echo '::set-env JWT_EMAIL_KEY=${{ secrets.JWT_EMAIL_KEY }}'
      - name: Test
        run: docker-compose -f docker-compose.integration-testing.yml up --build --exit-code-from web
