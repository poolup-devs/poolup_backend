name: Docker Image CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    name: Testing CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up env and run containers
        env:
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_EMAIL_KEY: ${{ secrets.JWT_EMAIL_KEY }}
        run: |
          docker-compose -f docker-compose.integration-testing.yml up --build --exit-code-from web
