name: Docker Image CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build and run tests
      - env: $JWT_EMAIL_KEY:${{secrets.JWT_EMAIL_KEY}}
      - env: $JWT_SECRET_KEY:${{secrets.JWT_SECRET_KEY}}
        run: docker-compose -f docker-compose.integration-testing.yml
