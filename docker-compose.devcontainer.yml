version: "3.4"
services:
  mongo:
    image: mongo
    ports:
      - 27017:27017
  web:
    build:
      context: .
      target: builder
    entrypoint:
      - tail
    command:
      - -f
      - /dev/null
    ports:
      - 3000:3000
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules
