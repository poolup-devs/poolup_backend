version: "3.4"
services:
  mongo:
    image: mongo
    ports:
      - 27017:27017
  web:
    build:
      context: .
    ports:
      - 3000:3000
    depends_on:
      - mongo
    volumes:
      - .:/app
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
